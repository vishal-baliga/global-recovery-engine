name: gre-temporal
services:
  temporal:
    image: temporalio/temporal:1.8.3@sha256:cea463d98a8d6def4420f903ea5c3fcd0d85c8d10fbcc2770a50c12fff2eb26d
    platform: linux/arm64
    command:
      - server
      - start-dev
      - --ip=0.0.0.0
      - --db-filename=/home/temporal/gre-temporal.db
      - --ui-ip=0.0.0.0
      - --ui-port=8233
      - --ui-disable-news-fetch
    volumes:
      - temporal_data:/home/temporal
    networks:
      temporal:
        aliases: [gre-temporal]
      ui: {}
    ports:
      - "127.0.0.1:8233:8233"
    healthcheck:
      test: [CMD, temporal, operator, cluster, health, --address=127.0.0.1:7233]
      interval: 2s
      timeout: 5s
      retries: 45
      start_period: 10s
    stop_grace_period: 30s
volumes:
  temporal_data:
    name: gre-temporal-dev-data
networks:
  temporal:
    name: gre-temporal
    internal: true
  ui:
    name: gre-temporal-ui
    driver: bridge
