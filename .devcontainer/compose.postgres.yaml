name: gre-local
services:
  postgres:
    image: postgres:18.6-bookworm
    platform: linux/arm64
    environment:
      POSTGRES_USER: gre_dev
      POSTGRES_DB: gre_dev
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      database:
        aliases:
          - gre-postgres
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U gre_dev -d gre_dev']
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s
    stop_grace_period: 30s
secrets:
  postgres_password:
    file: ../local-data/postgres/password
volumes:
  postgres_data:
    name: gre-postgres18-data
networks:
  database:
    name: gre-database
    internal: true
