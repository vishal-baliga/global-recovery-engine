[project]
name = "gre-dependency-baseline"
version = "0.1.0"
description = "Shared GRE Python dependencies, validated by setup-only fixtures"
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi==0.141.1",
  "pydantic==2.13.5",
  "sqlalchemy==2.0.52",
  "psycopg[binary]==3.3.5",
  "alembic==1.19.2",
  "temporalio==1.32.0",
  "azure-storage-blob==12.30.1",
  "uvicorn==0.52.4",
]

[dependency-groups]
dev = ["httpx==0.28.1"]

[tool.uv]
package = false
